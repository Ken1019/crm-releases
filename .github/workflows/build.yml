name: Windowsインストーラーを作る

# ・どのブランチに push しても：Windowsでテスト → GHMS.exe とインストーラーを作って動作確認（成果物として保存）
# ・v1.2.3 のようなタグを push したとき：上に加えて GitHub のリリースとして公開
#   （各事業所のGHMSは、公開された latest.json を見て更新を知らせる）
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要な部品を入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest pillow

      - name: テスト（Windows）
        run: python -m pytest -q

      - name: 版の番号を確認
        id: ver
        run: |
          $v = python -c "import ghms; print(ghms.VERSION)"
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "タグ $env:GITHUB_REF_NAME と ghms/__init__.py の VERSION（$v）が一致しません"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: GHMS.exe を作る（PyInstaller）
        run: |
          python packaging/make_icon.py packaging/ghms.ico
          pyinstaller --noconfirm --clean --windowed --name GHMS --icon packaging/ghms.ico `
            --add-data "ghms/templates;ghms/templates" --add-data "ghms/static;ghms/static" run.py

      - name: GHMS.exe の動作確認（起動 → 応答 → 停止）
        run: |
          $env:GHMS_HOME = Join-Path $env:RUNNER_TEMP "ghms_smoke"
          New-Item -ItemType Directory -Force $env:GHMS_HOME | Out-Null
          Start-Process -FilePath "dist\GHMS\GHMS.exe" -ArgumentList "--no-browser"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8000/__ping -TimeoutSec 2; if ($r.ok) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ok) { Get-ChildItem -Recurse $env:GHMS_HOME | Out-String | Write-Host; throw "GHMS.exe が起動しませんでした" }
          if ($r.version -ne "${{ steps.ver.outputs.version }}") { throw "版が違います: $($r.version)" }
          (Invoke-WebRequest http://127.0.0.1:8000/setup -UseBasicParsing).StatusCode
          (Start-Process -FilePath "dist\GHMS\GHMS.exe" -ArgumentList "--stop" -PassThru).WaitForExit(60000) | Out-Null
          Start-Sleep -Seconds 2
          try { Invoke-RestMethod http://127.0.0.1:8000/__ping -TimeoutSec 2; throw "止まっていません" } catch { if ($_.Exception.Message -eq "止まっていません") { throw } }
          Write-Host "GHMS.exe OK"

      - name: インストーラーを作る（Inno Setup）
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "インストーラーを作れませんでした" }

      - name: インストーラーの動作確認（選んだ場所に入れる → 起動 → 入れ直してバックアップ → アンインストールでもデータが残る）
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $data = "C:\GHMSのデータ"
          $exe = Join-Path $env:ProgramFiles "GHMS\GHMS.exe"
          function Install($extra) {
            # -Wait はインストーラーが起動したGHMSの終了まで待ってしまうため、インストーラー本体だけを待つ
            $a = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/LOG","/MERGETASKS=!desktopicon,!startup") + $extra
            $p = Start-Process -FilePath "dist\GHMS-Setup-$v.exe" -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(300000)) { throw "インストーラーが終わりません" }
            if ($p.ExitCode -ne 0) { throw "インストーラーがエラーで終わりました: $($p.ExitCode)" }
            if (-not (Test-Path $exe)) { throw "インストールされていません" }
          }
          function WaitPing {
            for ($i = 0; $i -lt 60; $i++) {
              try { $r = Invoke-RestMethod http://127.0.0.1:8000/__ping -TimeoutSec 2; if ($r.ok) { return $r } } catch {}
              Start-Sleep -Seconds 1
            }
            Start-Process -FilePath $exe -ArgumentList "--no-browser"; Start-Sleep -Seconds 10
            try { return Invoke-RestMethod http://127.0.0.1:8000/__ping -TimeoutSec 5 } catch {
              # 起動しないときは、原因がわかるようにログ・設定・権限を出す
              Write-Host "---- config.ini"; Get-Content (Join-Path $env:ProgramData "GHMS\config.ini") -ErrorAction SilentlyContinue | Out-Host
              Write-Host "---- ghms.log"; Get-Content (Join-Path $env:ProgramData "GHMS\logs\ghms.log") -Tail 80 -ErrorAction SilentlyContinue | Out-Host
              Write-Host "---- files"; Get-ChildItem -Recurse (Join-Path $env:ProgramData "GHMS"), $data -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
              Write-Host "---- acl"; icacls (Join-Path $env:ProgramData "GHMS") | Out-Host; icacls $data | Out-Host; reg query "HKLM\SOFTWARE\GHMS" | Out-Host
              Write-Host "---- processes"; Get-Process GHMS -ErrorAction SilentlyContinue | Format-Table Id, StartTime, CPU | Out-String | Write-Host
              Write-Host "---- netstat"; netstat -ano | Select-String ":8000" | Out-Host
              Write-Host "---- installer log"; Get-ChildItem $env:TEMP -Filter "Setup Log*.txt" | Sort-Object LastWriteTime | Select-Object -Last 1 | Get-Content -Tail 60 | Out-Host
              throw "GHMS が起動しませんでした"
            }
          }
          function StopGhms { (Start-Process -FilePath $exe -ArgumentList "--stop" -PassThru).WaitForExit(60000) | Out-Null; Start-Sleep -Seconds 2 }

          Install @("/DATADIR=`"$data`"")
          $r = WaitPing
          Write-Host "installed version: $($r.version)"
          if (-not (Test-Path (Join-Path $data "ghms.sqlite3"))) { Get-Content (Join-Path $env:ProgramData "GHMS\config.ini"); throw "選んだ場所にデータが作られていません" }
          if (Test-Path (Join-Path $env:ProgramData "GHMS\data\ghms.sqlite3")) { throw "決まった場所にもデータが作られています" }
          StopGhms

          # 入れ直し（更新と同じ）：場所は変わらず、入れかえる前のバックアップができる
          Install @()
          $r = WaitPing
          $bk = Get-ChildItem (Join-Path $data "backup\before_install") -Filter "ghms_*.sqlite3"
          if (-not $bk) { throw "入れかえる前のバックアップがありません" }
          Write-Host "before_install: $($bk.Name)"
          StopGhms

          $u = Start-Process -FilePath (Join-Path $env:ProgramFiles "GHMS\unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -PassThru
          if (-not $u.WaitForExit(300000)) { throw "アンインストールが終わりません" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "アンインストールできていません" }
          if (-not (Test-Path (Join-Path $data "ghms.sqlite3"))) { throw "アンインストールでデータが消えています" }
          if (-not (Test-Path (Join-Path $env:ProgramData "GHMS\config.ini"))) { throw "アンインストールで設定が消えています" }
          Write-Host "installer OK"

      - name: 更新情報（latest.json）を作る
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          python packaging/make_manifest.py $v "dist/GHMS-Setup-$v.exe" dist/latest.json "${{ github.repository }}"
          python -c "import sys; sys.path.insert(0,'packaging'); from make_manifest import notes_for; open('dist/notes.md','w',encoding='utf-8').write(notes_for('$v') or 'GHMS $v')"

      - uses: actions/upload-artifact@v4
        with:
          name: GHMS-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/GHMS-Setup-*.exe
            dist/latest.json

      - name: リリースとして公開（タグのときだけ）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create $env:GITHUB_REF_NAME "dist/GHMS-Setup-$v.exe" dist/latest.json --title "GHMS $v" --notes-file dist/notes.md
