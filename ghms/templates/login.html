{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="auth card">
  <h1>🌼 {{ office_name }}</h1>
  <p class="muted" style="text-align:center">管理者も職員も、この画面からログインします。<br>自分のユーザー名とパスワードを入れてください。</p>
  <form method="post">
    <label><span>ユーザー名</span><input name="username" required autofocus autocomplete="username"></label>
    <label><span>パスワード</span><input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary big">ログイン</button>
  </form>
  <p class="muted small" style="margin-top:16px">🔒 入居者の大切な個人情報を扱います。パスワードは人に教えず、使い終わったら必ず「ログアウト」してください。
    パスワードを忘れたときは管理者に再設定を頼んでください。</p>
</div>
{% endblock %}
