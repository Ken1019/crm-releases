<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}｜{{ office.office_name or office.get('office_name', '') }}</title>
<style>
body{font-family:"BIZ UDPMincho","BIZ UD明朝","Yu Mincho","MS Mincho",serif;color:#222;background:#eee;margin:0;font-size:13px}
.bar{position:sticky;top:0;background:#fff8f0;border-bottom:2px solid #ff8a3d;padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:"BIZ UDPGothic","Meiryo UI",sans-serif;z-index:5}
.bar button,.bar a.b{font:inherit;font-size:15px;padding:7px 20px;border-radius:10px;border:2px solid #e86f1f;background:#ff8a3d;color:#fff;cursor:pointer;text-decoration:none}
.bar a.b{background:#fff;color:#333;border-color:#ccc}
.bar .note{color:#555;font-size:13px}
.bar select,.bar input{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid #ccc}
.page{width:190mm;min-height:270mm;margin:10mm auto;background:#fff;padding:12mm 14mm;box-sizing:border-box}
.page.land{width:277mm;min-height:180mm}
h1{font-size:20px;text-align:center;margin:0 0 6px;letter-spacing:.1em}
h2{font-size:15px;margin:14px 0 6px;border-left:4px solid #555;padding-left:8px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;margin:6px 0}
th,td{border:1px solid #555;padding:4px 6px;vertical-align:top}
th{background:#f2f2f2;font-weight:bold}
td.c,th.c{text-align:center} td.r{text-align:right}
.pre{white-space:pre-wrap}
.muted{color:#666}
.draft{border:1px dashed #c00;color:#c00;padding:6px 10px;margin:8px 0;font-size:12px}
[contenteditable]{outline:1px dashed #9cf;outline-offset:4px}
tr.sat td{background:#f3f8fd} tr.sun td{background:#fdf1f1}
@media print{body{background:#fff}.bar,.noprint{display:none!important}.page{margin:0;width:auto;min-height:auto;padding:0;page-break-after:always}
  .page:last-child{page-break-after:auto}[contenteditable]{outline:none}@page{size:A4 {% block orient %}portrait{% endblock %};margin:12mm}}
</style></head><body>
<div class="bar">
  <button onclick="window.print()">🖨️ 印刷する（PDFに保存もできます）</button>
  <a class="b" href="{% block back %}{{ url_for('docs.renewal') }}{% endblock %}">もどる</a>
  {% block toolbar %}{% endblock %}
</div>
{% block pages %}{% endblock %}
</body></html>
