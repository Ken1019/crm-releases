<form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) if request.args.get('next') else url_for('auth.login') }}" class="pwform">
  <label><span>ユーザー名</span><input name="username" required {{ '' if device else 'autofocus' }} autocomplete="username"></label>
  <label><span>パスワード</span><input type="password" name="password" required autocomplete="current-password"></label>
  <button class="btn primary big">ログイン</button>
</form>
