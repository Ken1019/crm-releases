{% extends 'base.html' %}
{% block title %}パスワード変更{% endblock %}
{% block content %}
<h1>🔑 パスワードを変える</h1>
{% if must %}<p class="flash error">安全のため、最初に自分だけが知っているパスワードに変えてください。変えるまで他の画面は使えません。</p>{% endif %}
<p class="guide">8文字以上で、英字と数字の両方を入れてください。誕生日や名前など、人に推測されやすいものは避けてください。</p>
<form method="post" class="card form">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <label><span>今のパスワード{% if must %}（管理者から伝えられたもの）{% endif %}</span><input type="password" name="current" required autocomplete="current-password"></label>
  <label><span>新しいパスワード</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
  <label><span>新しいパスワード（確認のためもう一度）</span><input type="password" name="password2" required minlength="8" autocomplete="new-password"></label>
  <div class="actions wide"><button class="btn primary">💾 変更する</button></div>
</form>
{% endblock %}
