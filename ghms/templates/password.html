{% extends 'base.html' %}
{% block title %}パスワード変更{% endblock %}
{% block content %}
<h1>パスワード変更</h1>
<form method="post" class="card form">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <label><span>現在のパスワード</span><input type="password" name="current" required></label>
  <label><span>新しいパスワード（8文字以上）</span><input type="password" name="password" required minlength="8"></label>
  <div class="actions wide"><button class="btn primary">変更</button></div>
</form>
{% endblock %}
