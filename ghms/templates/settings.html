{% extends 'base.html' %}
{% block title %}事業所設定{% endblock %}
{% block content %}
<h1>事業所設定</h1>
<form method="post" class="card form">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  {% for k, label, v in items %}<label><span>{{ label }}</span><input name="{{ k }}" value="{{ v }}"></label>{% endfor %}
  <div class="actions wide"><button class="btn primary">💾 保存する</button></div>
</form>
{% endblock %}
